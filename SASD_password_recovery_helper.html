<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة مرور نظام SASD</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px; background: #f1f5f9; color: #0f172a; font-family: Tahoma, Arial, sans-serif; }
    main { width: min(100%, 510px); background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 28px; box-shadow: 0 16px 42px rgba(15,23,42,.09); }
    h1 { font-size: 1.45rem; margin: 0 0 8px; color: #312e81; }
    p { line-height: 1.9; color: #475569; }
    label { display:block; margin: 17px 0 7px; font-weight: 700; }
    input { width:100%; padding:12px 13px; border:1px solid #cbd5e1; border-radius:10px; font:inherit; }
    button { width:100%; padding:13px 16px; margin-top:20px; border:0; border-radius:10px; color:#fff; background:#4338ca; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #status { margin-top:16px; padding:12px; border-radius:10px; line-height:1.8; display:none; }
    #status.error { display:block; background:#fef2f2; color:#991b1b; }
    #status.ok { display:block; background:#ecfdf5; color:#065f46; }
    #status.info { display:block; background:#eff6ff; color:#1e40af; }
    .hint { font-size:.86rem; color:#64748b; }
  </style>
</head>
<body>
  <main>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p>هذه الصفحة مخصصة فقط لإكمال رابط استعادة كلمة المرور لحساب نظام SASD. لا تعرض سجلات المستفيدين ولا تطلب كلمة المرور القديمة.</p>
    <div id="tokenHelp" class="hint">جارٍ التحقق من رابط الاستعادة...</div>
    <form id="resetForm" hidden>
      <label for="newPassword">كلمة المرور الجديدة</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="8 أحرف على الأقل">
      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="أعد كتابة كلمة المرور">
      <button id="submitBtn" type="submit">حفظ كلمة المرور الجديدة</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <p class="hint">بعد النجاح، ارجع إلى ملف SASD المحلي على جهازك وسجّل الدخول بالبريد وكلمة المرور الجديدة. لا تحذف بيانات المتصفح.</p>
  </main>
<script>
(() => {
  'use strict';
  const SUPABASE_URL = 'https://yjysevnladslxkobnchn.supabase.co';
  const SUPABASE_PUBLIC_KEY = 'sb_publishable_kPRJipAD5V_QYyuLDsH-Qw_oD6U-j1S';
  let recoveryAccessToken = '';
  const form = document.getElementById('resetForm');
  const tokenHelp = document.getElementById('tokenHelp');
  const statusEl = document.getElementById('status');
  const button = document.getElementById('submitBtn');
  const setStatus = (text, type) => { statusEl.textContent = text; statusEl.className = type; };
  const cleanUrl = () => { try { history.replaceState({}, document.title, location.pathname + location.search); } catch (_) {} };

  async function initialize() {
    const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
    const query = new URLSearchParams(location.search);
    if (hash.get('error_description') || query.get('error_description')) {
      const reason = hash.get('error_description') || query.get('error_description');
      tokenHelp.textContent = '';
      setStatus('تعذر استخدام رابط الاستعادة: ' + reason.replace(/\+/g, ' '), 'error');
      return;
    }
    const kind = hash.get('type') || query.get('type') || '';
    recoveryAccessToken = hash.get('access_token') || '';
    if (!recoveryAccessToken && query.get('token_hash')) {
      try {
        const verifyResponse = await fetch(SUPABASE_URL + '/auth/v1/verify', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_PUBLIC_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ token_hash: query.get('token_hash'), type: 'recovery' })
        });
        const verifyData = await verifyResponse.json().catch(() => ({}));
        if (!verifyResponse.ok || !verifyData.access_token) throw new Error(verifyData.msg || verifyData.message || 'الرابط منتهي الصلاحية أو مستخدم مسبقًا.');
        recoveryAccessToken = verifyData.access_token;
      } catch (error) {
        tokenHelp.textContent = '';
        setStatus('لم نستطع التحقق من رابط الاستعادة. اطلب رسالة جديدة. التفاصيل: ' + error.message, 'error');
        return;
      }
    }
    if (!recoveryAccessToken && !query.get('token_hash') && !hash.get('error_description') && !query.get('error_description')) {
      tokenHelp.textContent = 'هذه صفحة الاستعادة جاهزة. افتحها من أحدث رابط استعادة يصلك إلى بريدك الإلكتروني، وليس بفتح العنوان مباشرة.';
      setStatus('لم يتم فتح رابط استعادة بعد. ظهور هذه الرسالة عند فتح الصفحة مباشرة أمر طبيعي.', 'info');
      return;
    }
    if (!recoveryAccessToken || !['recovery'].includes(kind)) {
      tokenHelp.textContent = '';
      setStatus('رابط الاستعادة غير مكتمل أو انتهت صلاحيته. اطلب رسالة استعادة جديدة، ثم افتح أحدث رسالة فقط.', 'error');
      return;
    }
    tokenHelp.textContent = 'تم التحقق من وجود رمز الاستعادة. أدخل كلمة مرور جديدة ثم أكدها.';
    form.hidden = false;
    cleanUrl();
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (password.length < 8) { setStatus('اجعل كلمة المرور 8 أحرف على الأقل.', 'error'); return; }
    if (password !== confirmPassword) { setStatus('كلمتا المرور غير متطابقتين.', 'error'); return; }
    if (!recoveryAccessToken) { setStatus('رابط الاستعادة غير صالح. اطلب رابطًا جديدًا.', 'error'); return; }
    button.disabled = true;
    button.textContent = 'جارٍ حفظ كلمة المرور...';
    try {
      const response = await fetch(SUPABASE_URL + '/auth/v1/user', {
        method: 'PUT',
        headers: {
          'apikey': SUPABASE_PUBLIC_KEY,
          'Authorization': 'Bearer ' + recoveryAccessToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ password })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.msg || data.message || data.error_description || 'تعذر تحديث كلمة المرور.');
      recoveryAccessToken = '';
      form.hidden = true;
      document.getElementById('tokenHelp').textContent = 'اكتملت استعادة كلمة المرور.';
      setStatus('تم تغيير كلمة المرور بنجاح. ارجع إلى ملف SASD المحلي وسجّل الدخول باستخدام البريد نفسه وكلمة المرور الجديدة. لم يتم تغيير أي سجل في قاعدة بيانات المستفيدين.', 'ok');
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
    } catch (error) {
      setStatus('لم يتم تغيير كلمة المرور: ' + error.message + ' — إذا كان الرابط قديمًا، اطلب رابط استعادة جديدًا.', 'error');
    } finally {
      button.disabled = false;
      button.textContent = 'حفظ كلمة المرور الجديدة';
    }
  });
  initialize();
})();
</script>
</body>
</html>
